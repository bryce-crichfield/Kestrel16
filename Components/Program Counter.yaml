name: Program Counter
description: "PC: a 16-bit register that can also count. On the rising edge of CLK it loads D if /LOAD is 0, otherwise adds 2 if INC is 1 (bit 0 stays as it is), otherwise keeps its value. Two tri-state read ports like Register 16's: QA while /OEA is 0, QB while /OEB is 0. In 74HC terms: four 74HC161 counters for bits 1-15 plus a flip-flop for bit 0, and four 74HC541s."
