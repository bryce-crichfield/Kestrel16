name: Shifter 16
description: "A barrel shifter: Y = A shifted by N (0-15) while /OE is 0, left when LEFT is 1, otherwise right, filling with A15 when ARITH is 1 (SAR). C is the last bit shifted out, or CIN when N is 0. A left shift reverses A, shifts right and reverses back; the right shift is 17 bits wide, with a guard bit below A0 that catches the bit shifted out. Four stages of Mux 2x4s (74HC157s), one per bit of N."
