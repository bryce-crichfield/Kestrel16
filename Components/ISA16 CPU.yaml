name: ISA16 CPU
description: "The ISA-16 processor. Memory interface: A0-15 address, DO0-15 data out (driven only while storing), DI0-15 data in, /OE read strobe, /WEL and /WEH write strobes for the even (low) and odd (high) byte. TIRQ is the timer's interrupt request, ACK says it was taken, TICK marks each instruction. HALTED: HALT ran (waiting for an interrupt); ILLEGAL: stopped on an illegal instruction."
