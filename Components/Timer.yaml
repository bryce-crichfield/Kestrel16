name: Timer
description: "The emulator's timer at 0xFF04. Writing N (/CE and /WE low at a rising CLK edge) starts it: every Nth TICK (one per instruction) it requests an interrupt on IRQ until ACK; N = 0 stops it. Reading (/CE and /OE low) gives N back on Q."
