name: Register 16
description: "16-bit register. On the rising edge of CLK it loads D if /LOAD is 0 and keeps its value otherwise. Two tri-state read ports: QA drives while /OEA is 0, QB while /OEB is 0. In 74HC terms: two 74HC377s and four 74HC541s."
