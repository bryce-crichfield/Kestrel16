name: ALU 16
description: "16-bit ALU from four ROM slices, each a 64K x 8 EEPROM holding ALU Slice.bin (made by Tools/make_alu.py) and working on 4 bits. OP: 0 ADD, 1 SUB, 2 AND, 3 OR, 4 XOR, 5 SHL, 6 SHR, 7 SAR, 8 NOT, 9 NEG, 10 PASSA, 11 PASSB, 12 SXB; 13-15 act as PASSA. Shifts move one bit; the control unit repeats them (B & 15) times. Cin: 0 for ADD, 1 for SUB/CMP/NEG, the C flag for ADC/SBC, shifts and everything else. C: adder carry, the bit shifted out, or Cin passed through. V: overflow for ADD/SUB/NEG. Z and N describe Y. Which flags get stored is up to the control unit."
