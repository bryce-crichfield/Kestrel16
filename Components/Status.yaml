name: Status
description: "The flags and the interrupt enable, all loaded on the rising edge of CLK. WZN, WC and WV store the ALU's flags (MOV, LDI and loads store none). SAVE copies the flags and IE into the exception copies (on an interrupt or TRAP); RESTORE copies them back (RETI). IESET and IECLR are EI and DI."
