name: Control Unit
description: "The microcode sequencer: a 5-bit state register and two 32K-word ROMs, Control A.bin (30 bits) and Control B.bin (20 bits), both made by Tools/make_cpu.py. The ROMs see the state, the opcode, the function (IR2-0, or IR11-8 for SYS), TAKE (the branch condition holds) and IRQ; they give every control signal plus the next state, which loads on the rising edge of CLK. Power-up state 0 is RESET."
