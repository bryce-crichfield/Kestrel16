name: Program Counter
id: PC
revision: A
summary: >
  16-bit register that can count by two. On the rising edge of CLK it loads D[15:0] when
  /LOAD is low; otherwise it adds 2 when INC is high (bit 0 unchanged); otherwise it holds.
  QA drives while /OEA is low, QB while /OEB is low; outputs are independent of the clock.

specs:
  - [Width, 16 bits]
  - [Logic family, "74HC, 5 V"]
  - [Clocking, "Rising edge, synchronous"]
  - [Count step, "+2 (bits 15–1)"]
  - [Read ports, 2 × tri-state]
  - [Chips, 9]

pins:
  - {name: "D[15:0]", dir: in, width: 16, desc: "Address to load (jump target)"}
  - {name: /LOAD, dir: in, active: low, desc: "Load enable, sampled on CLK ↑; overrides INC"}
  - {name: INC, dir: in, desc: "Count enable: add 2 on CLK ↑"}
  - {name: CLK, dir: in, clock: true, desc: "Clock, rising edge"}
  - {name: /OEA, dir: in, active: low, desc: "Enable read port A"}
  - {name: /OEB, dir: in, active: low, desc: "Enable read port B"}
  - {name: "QA[15:0]", dir: out, width: 16, desc: "Read port A, tri-state"}
  - {name: "QB[15:0]", dir: out, width: 16, desc: "Read port B, tri-state"}

schematic:
  columns: [[U1, U2, U3, U4, U5], [U6–U7, U8–U9]]
  chips:
    U1: {part: 74HC377, label: bit 0,
         inputs: [D, {name: /E, active: low}, {name: CP, clock: true}], outputs: [Q]}
    U2: {part: 74HC161, label: bits 4–1,
         inputs: [{name: D, width: 4}, ENP, {name: /LOAD, active: low}, {name: CP, clock: true}, {name: ENT, side: top}],
         outputs: [{name: Q, width: 4}, {name: RCO, side: bottom}]}
    U3: {part: 74HC161, label: bits 8–5,
         inputs: [{name: D, width: 4}, ENP, {name: /LOAD, active: low}, {name: CP, clock: true}, {name: ENT, side: top}],
         outputs: [{name: Q, width: 4}, {name: RCO, side: bottom}]}
    U4: {part: 74HC161, label: bits 12–9,
         inputs: [{name: D, width: 4}, ENP, {name: /LOAD, active: low}, {name: CP, clock: true}, {name: ENT, side: top}],
         outputs: [{name: Q, width: 4}, {name: RCO, side: bottom}]}
    U5: {part: 74HC161, label: bits 15–13,
         inputs: [{name: D, width: 3}, ENP, {name: /LOAD, active: low}, {name: CP, clock: true}, {name: ENT, side: top}],
         outputs: [{name: Q, width: 3}]}
    U6–U7: {part: 2× 74HC541, label: QA,
            inputs: [Q0, {name: Q4–1, width: 4}, {name: Q8–5, width: 4}, {name: Q12–9, width: 4},
                     {name: Q15–13, width: 3}, {name: /OE1, active: low}],
            outputs: [{name: Y, width: 16}]}
    U8–U9: {part: 2× 74HC541, label: QB,
            inputs: [Q0, {name: Q4–1, width: 4}, {name: Q8–5, width: 4}, {name: Q12–9, width: 4},
                     {name: Q15–13, width: 3}, {name: /OE1, active: low}],
            outputs: [{name: Y, width: 16}]}
  nets:
    - {from: D0, to: [U1.D]}
    - {from: "D[4:1]", to: [U2.D], width: 4}
    - {from: "D[8:5]", to: [U3.D], width: 4}
    - {from: "D[12:9]", to: [U4.D], width: 4}
    - {from: "D[15:13]", to: [U5.D], width: 3}
    - {from: /LOAD, to: [U1./E, U2./LOAD, U3./LOAD, U4./LOAD, U5./LOAD]}
    - {from: CLK, to: [U1.CP, U2.CP, U3.CP, U4.CP, U5.CP]}
    - {from: INC, to: [U2.ENT, U2.ENP, U3.ENP, U4.ENP, U5.ENP]}
    - {from: U2.RCO, to: [U3.ENT]}
    - {from: U3.RCO, to: [U4.ENT]}
    - {from: U4.RCO, to: [U5.ENT]}
    - {from: U1.Q, to: [U6–U7.Q0, U8–U9.Q0]}
    - {from: U2.Q, to: [U6–U7.Q4–1, U8–U9.Q4–1], width: 4}
    - {from: U3.Q, to: [U6–U7.Q8–5, U8–U9.Q8–5], width: 4}
    - {from: U4.Q, to: [U6–U7.Q12–9, U8–U9.Q12–9], width: 4}
    - {from: U5.Q, to: [U6–U7.Q15–13, U8–U9.Q15–13], width: 3}
    - {from: /OEA, to: [U6–U7./OE1]}
    - {from: /OEB, to: [U8–U9./OE1]}
    - {from: U6–U7.Y, to: ["QA[15:0]"], width: 16}
    - {from: U8–U9.Y, to: ["QB[15:0]"], width: 16}

tables:
  - title: Count / load
    legend: "↑ rising edge · X don't care · /LOAD overrides INC"
    columns: [CLK, /LOAD, INC, PC next]
    rows:
      - [↑, 0, X, D]
      - [↑, 1, 1, PC + 2]
      - [↑, 1, 0, PC]
      - [0 / 1 / ↓, X, X, PC]
  - title: Read ports
    legend: "independent of CLK · Z high-impedance"
    columns: [/OEA, "QA[15:0]", /OEB, "QB[15:0]"]
    rows:
      - [0, PC, 0, PC]
      - [1, Z, 1, Z]

bom:
  - [U1, 1, 74HC377, "Octal D flip-flop with enable (1 bit used)", DIP-20]
  - [U2–U5, 4, 74HC161, 4-bit synchronous binary counter, DIP-16]
  - [U6–U9, 4, 74HC541, Octal tri-state buffer, DIP-20]
  - [C1–C9, 9, 100 nF, "Ceramic decoupling, one per chip", 2.54 mm]
